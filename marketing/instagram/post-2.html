<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- INSTAGRAM CARROSSEL — SLIDE 2 · EXPORTAR 1080 × 1080 -->
<title>Post 2 — efeitos</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--em:#3d5c52;--gold:#a97f3d;--paper:#f2eee6;--ink:#23272c;--muted:#6d6a62;--line:#e5dfd3;
    --serif:'Playfair Display',Georgia,serif;--ui:'Inter','Open Sans',system-ui,sans-serif;--hand:'Caveat',cursive}
  *{box-sizing:border-box;margin:0}
  body{width:1080px;height:1080px;overflow:hidden;font-family:var(--ui);
    background:radial-gradient(700px 520px at 82% 108%,#fff7ec,transparent 60%),var(--paper);
    padding:70px 76px;display:flex;flex-direction:column}
  .kicker{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-family:var(--serif);font-size:52px;line-height:1.06;color:var(--ink);margin:12px 0 6px;max-width:720px}
  .sub{font-size:19px;color:var(--muted);margin-bottom:40px}
  .grid{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:34px 40px;place-items:center}
  .item{text-align:center}
  .pol{width:216px;background:#fff;padding:12px 12px 0;box-shadow:0 14px 30px -10px rgba(35,39,44,.3);position:relative}
  .pol .ph{aspect-ratio:1;background:linear-gradient(160deg,#f6cf9f,#e88f6b 55%,#7a5b74)}
  .item:nth-child(2) .ph{background:linear-gradient(160deg,#c3e2e7,#7fb3bf 55%,#3f6f7a)}
  .item:nth-child(3) .ph{background:linear-gradient(160deg,#e2e8cd,#a9bd8a 55%,#6f8f6a)}
  .item:nth-child(4) .ph{background:linear-gradient(160deg,#f4dbe3,#d99fb0 55%,#8b6b86)}
  .pol .c{height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:19px;color:#3a3a3a}
  .name{margin-top:14px;font-family:var(--serif);font-size:20px;color:var(--ink)}
  .fita{position:absolute;top:26px;left:14px;width:52px;height:17px;background:rgba(214,196,140,.72);transform:rotate(-45deg);box-shadow:0 1px 3px rgba(0,0,0,.16)}
  .fita.r{left:auto;right:14px;transform:rotate(45deg)}
  .grampo{position:absolute;top:22px;left:20px;width:22px;height:14px;border:3px solid #8b9199;border-bottom:0;border-radius:4px 4px 0 0;transform:rotate(-45deg)}
  .grampo.r{left:auto;right:20px;transform:rotate(45deg)}
  .brad{position:absolute;top:26px;left:20px;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff,rgba(255,255,255,0) 46%),#a97f3d;box-shadow:0 1px 2px rgba(0,0,0,.4)}
  .brad.r{left:auto;right:20px}.brad.b{top:auto;bottom:54px}
  .pin{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 33% 28%,#fff,rgba(255,255,255,0) 42%),#b23b2c;box-shadow:0 3px 6px rgba(0,0,0,.4)}
  .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:20px;font-size:15px;color:var(--muted)}
  .foot b{color:var(--ink);font-family:var(--serif)}
</style></head><body>

  <div class="kicker">Detalhes</div>
  <h1>O que faz parecer feito à mão.</h1>
  <div class="sub">Fita, grampo, mini brad, percevejo — sempre dentro do card, igual no papel.</div>

  <div class="grid">
    <div class="item"><div class="pol"><i class="fita"></i><i class="fita r"></i><div class="ph"></div><div class="c">viagem</div></div><div class="name">Fita adesiva</div></div>
    <div class="item"><div class="pol"><i class="grampo"></i><i class="grampo r"></i><div class="ph"></div><div class="c">domingo</div></div><div class="name">Grampo</div></div>
    <div class="item"><div class="pol"><i class="brad"></i><i class="brad r"></i><i class="brad b"></i><i class="brad r b"></i><div class="ph"></div><div class="c">quintal</div></div><div class="name">Mini brad</div></div>
    <div class="item"><div class="pol"><i class="pin"></i><div class="ph"></div><div class="c">mural</div></div><div class="name">Percevejo</div></div>
  </div>

  <div class="foot"><b>Polaroide Studio</b><span>polaroidestudio.esmeraldapaper.com.br</span></div>

</body></html>
