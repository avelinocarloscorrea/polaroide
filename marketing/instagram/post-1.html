<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- INSTAGRAM POST / CAPA DE CARROSSEL · EXPORTAR 1080 × 1080 -->
<title>Post 1 — capa</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--em:#3d5c52;--gold:#a97f3d;--paper:#f2eee6;--stage:#e6e0d4;--ink:#23272c;--muted:#6d6a62;--line:#e5dfd3;
    --serif:'Playfair Display',Georgia,serif;--ui:'Inter','Open Sans',system-ui,sans-serif;--hand:'Caveat',cursive}
  *{box-sizing:border-box;margin:0}
  body{width:1080px;height:1080px;overflow:hidden;font-family:var(--ui);
    background:radial-gradient(760px 620px at 26% 0,#fff7ec,transparent 60%),var(--paper);
    display:flex;flex-direction:column;align-items:center;padding:64px}
  .brand{display:flex;align-items:center;gap:14px;align-self:flex-start}
  .brand svg{width:42px;height:42px}
  .brand .n{font-family:var(--serif);font-size:23px;color:var(--ink);line-height:1}
  .brand .s{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .mid{flex:1;display:flex;align-items:center;justify-content:center;gap:44px;width:100%}
  .frame{width:430px;background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 44px 90px -34px rgba(35,50,45,.5);transform:rotate(-2deg)}
  .fbar{height:36px;background:#fbf9f4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 12px}
  .fbar i{width:9px;height:9px;border-radius:50%;background:#e0d9cb}
  .fstage{background:var(--stage);padding:26px;display:flex;justify-content:center}
  .sheet{width:300px;aspect-ratio:210/297;background:#fff;box-shadow:0 16px 32px rgba(35,39,44,.22);
    padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;align-content:start}
  .pol{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.16);padding:4px 4px 0;position:relative}
  .pol .ph{aspect-ratio:1}
  .pol .c{height:16px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:11px;color:#3a3a3a}
  .pol .tp{position:absolute;top:-4px;left:-3px;width:28px;height:10px;background:rgba(214,196,140,.62);transform:rotate(-38deg)}
  .a{background:linear-gradient(180deg,#f8cf9f,#e88f6b 55%,#7a5b74)}
  .b{background:linear-gradient(180deg,#c3e2e7,#7fb3bf 60%,#3f6f7a)}
  .g{background:linear-gradient(180deg,#e2e8cd,#a9bd8a 55%,#6f8f6a)}
  .d{background:linear-gradient(160deg,#f4dbe3,#d99fb0 60%,#8b6b86)}
  .e{background:linear-gradient(180deg,#ffe7ba,#f0b57a 50%,#b9743f)}
  .n2{background:linear-gradient(180deg,#2f3f5c,#5b6b8c 70%,#c9b7a0)}
  .cap{max-width:360px}
  .cap h1{font-family:var(--serif);font-size:52px;line-height:1.08;color:var(--ink)}
  .cap h1 em{font-style:normal;color:var(--em)}
  .cap p{margin-top:18px;font-size:20px;color:var(--muted);line-height:1.5}
  .arrow{margin-top:26px;display:flex;align-items:center;gap:10px;color:var(--em);font-weight:700;font-size:18px}
  .arrow svg{width:26px;height:26px}
  .foot{align-self:stretch;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--line);padding-top:22px;font-size:16px;color:var(--muted)}
  .foot b{color:var(--ink);font-family:var(--serif);font-weight:700}
</style></head><body>

  <div class="brand">
    <svg viewBox="0 0 64 64"><rect x="9" y="7" width="46" height="50" rx="5" fill="#fff" stroke="#3d5c52" stroke-width="3.5"/><rect x="15" y="13" width="34" height="27" rx="2" fill="#3d5c52"/><circle cx="32" cy="26.5" r="7.5" fill="#fff"/><circle cx="32" cy="26.5" r="3.4" fill="#3d5c52"/></svg>
    <div><div class="n">Polaroide Studio</div><div class="s">Esmeralda Paper</div></div>
  </div>

  <div class="mid">
    <div class="frame">
      <div class="fbar"><i></i><i></i><i></i></div>
      <div class="fstage"><div class="sheet">
        <div class="pol"><div class="ph a"></div><div class="c">verão</div><i class="tp"></i></div>
        <div class="pol"><div class="ph b"></div><div class="c">praia</div></div>
        <div class="pol"><div class="ph g"></div><div class="c">sítio</div></div>
        <div class="pol"><div class="ph d"></div><div class="c">tarde</div></div>
        <div class="pol"><div class="ph e"></div><div class="c">estrada</div></div>
        <div class="pol"><div class="ph n2"></div><div class="c">noite</div></div>
        <div class="pol"><div class="ph b"></div><div class="c">rio</div><i class="tp"></i></div>
        <div class="pol"><div class="ph a"></div><div class="c">janela</div></div>
        <div class="pol"><div class="ph g"></div><div class="c">trilha</div></div>
      </div></div>
    </div>
    <div class="cap">
      <h1>Polaroides prontos pra <em>imprimir</em> — no navegador.</h1>
      <p>Formatos reais · marcas de corte · PDF na hora.</p>
      <div class="arrow">
        <span>3 motivos pra testar</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  </div>

  <div class="foot"><b>Grátis, sem cadastro</b><span>polaroidestudio.esmeraldapaper.com.br</span></div>

</body></html>
