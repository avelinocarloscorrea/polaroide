<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- INSTAGRAM STORY · EXPORTAR 1080 × 1920 -->
<title>Story 1 — apresentação</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--em:#3d5c52;--gold:#a97f3d;--paper:#f2eee6;--stage:#e6e0d4;--ink:#23272c;--muted:#6d6a62;--line:#e5dfd3;
    --serif:'Playfair Display',Georgia,serif;--ui:'Inter','Open Sans',system-ui,sans-serif;--hand:'Caveat',cursive}
  *{box-sizing:border-box;margin:0}
  body{width:1080px;height:1920px;overflow:hidden;font-family:var(--ui);
    background:radial-gradient(900px 700px at 30% 0,#fff7ec,transparent 60%),var(--paper);
    display:flex;flex-direction:column;align-items:center;padding:96px 84px}
  .brand{display:flex;align-items:center;gap:16px}
  .brand svg{width:52px;height:52px}
  .brand .n{font-family:var(--serif);font-size:30px;color:var(--ink);line-height:1}
  .brand .s{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
  h1{font-family:var(--serif);font-size:72px;line-height:1.1;color:var(--ink);text-align:center;margin:56px 0 8px;max-width:900px}
  h1 em{font-style:normal;color:var(--em)}
  .rule{width:90px;height:5px;background:var(--gold);border-radius:3px;margin:20px 0 44px}
  /* mockup */
  .frame{width:760px;background:#fff;border-radius:20px;overflow:hidden;
    box-shadow:0 50px 100px -34px rgba(35,50,45,.5);transform:rotate(-1.4deg)}
  .fbar{height:44px;background:#fbf9f4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
  .fbar i{width:11px;height:11px;border-radius:50%;background:#e0d9cb}
  .fbar .u{margin-left:14px;font-size:13px;color:var(--muted)}
  .fstage{background:radial-gradient(circle at 50% 0,rgba(255,255,255,.55),transparent 55%),var(--stage);
    padding:40px;display:flex;justify-content:center}
  .sheet{width:420px;aspect-ratio:210/297;background:#fff;box-shadow:0 20px 44px rgba(35,39,44,.22);
    padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
  .pol{background:#fff;box-shadow:0 3px 7px rgba(0,0,0,.16);padding:6px 6px 0;position:relative}
  .pol .ph{aspect-ratio:1}
  .pol .c{height:22px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);font-size:15px;color:#3a3a3a}
  .pol .tp{position:absolute;top:-5px;left:-3px;width:38px;height:13px;background:rgba(214,196,140,.62);transform:rotate(-38deg)}
  .a{background:linear-gradient(180deg,#f8cf9f,#e88f6b 55%,#7a5b74)}
  .b{background:linear-gradient(180deg,#c3e2e7,#7fb3bf 60%,#3f6f7a)}
  .c2{background:linear-gradient(180deg,#e2e8cd,#a9bd8a 55%,#6f8f6a)}
  .d{background:linear-gradient(160deg,#f4dbe3,#d99fb0 60%,#8b6b86)}
  .e{background:linear-gradient(180deg,#ffe7ba,#f0b57a 50%,#b9743f)}
  .f{background:linear-gradient(180deg,#2f3f5c,#5b6b8c 70%,#c9b7a0)}
  .r-2{transform:rotate(-2deg)} .r2{transform:rotate(1.6deg)}
  .chips{display:flex;gap:14px;margin-top:56px}
  .chips span{background:#fff;border:1px solid var(--line);border-radius:99px;padding:14px 22px;
    font-size:19px;color:var(--ink);font-weight:600;box-shadow:0 6px 16px rgba(0,0,0,.05)}
  .foot{margin-top:auto;text-align:center}
  .foot .cta{font-family:var(--serif);font-size:30px;color:var(--em)}
  .foot .url{font-size:20px;color:var(--muted);margin-top:8px}
</style></head><body>

  <div class="brand">
    <svg viewBox="0 0 64 64"><rect x="9" y="7" width="46" height="50" rx="5" fill="#fff" stroke="#3d5c52" stroke-width="3.5"/><rect x="15" y="13" width="34" height="27" rx="2" fill="#3d5c52"/><circle cx="32" cy="26.5" r="7.5" fill="#fff"/><circle cx="32" cy="26.5" r="3.4" fill="#3d5c52"/></svg>
    <div><div class="n">Polaroide Studio</div><div class="s">Esmeralda Paper</div></div>
  </div>

  <h1>Suas fotos viram <em>polaroides</em> numa folha pronta pra imprimir.</h1>
  <div class="rule"></div>

  <div class="frame">
    <div class="fbar"><i></i><i></i><i></i><span class="u">polaroidestudio.esmeraldapaper.com.br</span></div>
    <div class="fstage"><div class="sheet">
      <div class="pol r-2"><div class="ph a"></div><div class="c">verão</div><i class="tp"></i></div>
      <div class="pol r2"><div class="ph b"></div><div class="c">praia</div></div>
      <div class="pol r-2"><div class="ph c2"></div><div class="c">sítio</div></div>
      <div class="pol r2"><div class="ph d"></div><div class="c">tarde</div></div>
      <div class="pol r-2"><div class="ph e"></div><div class="c">estrada</div></div>
      <div class="pol r2"><div class="ph f"></div><div class="c">noite</div></div>
      <div class="pol r-2"><div class="ph b"></div><div class="c">rio</div><i class="tp"></i></div>
      <div class="pol r2"><div class="ph a"></div><div class="c">janela</div></div>
      <div class="pol r-2"><div class="ph c2"></div><div class="c">trilha</div></div>
    </div></div>
  </div>

  <div class="chips"><span>Nada é enviado</span><span>Funciona offline</span><span>Grátis</span></div>

  <div class="foot">
    <div class="cta">Link na bio</div>
    <div class="url">polaroidestudio.esmeraldapaper.com.br</div>
  </div>

</body></html>
