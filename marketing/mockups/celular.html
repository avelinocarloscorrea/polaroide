<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- EXPORTAR: 1400 × 1000 -->
<title>Polaroide Studio — celular</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--em:#3d5c52;--em2:#2f4840;--gold:#a97f3d;--paper:#f2eee6;--stage:#e6e0d4;--ink:#23272c;--muted:#6d6a62;
    --line:#e5dfd3;--serif:'Playfair Display',Georgia,serif;--ui:'Inter','Open Sans',system-ui,sans-serif;--hand:'Caveat',cursive}
  *{box-sizing:border-box;margin:0}
  body{width:1400px;height:1000px;background:
      radial-gradient(900px 700px at 22% 30%,#456b60,transparent 60%),var(--em2);
    font-family:var(--ui);display:flex;align-items:center;gap:80px;padding:0 100px;overflow:hidden;color:#fff}
  .txt{width:560px}
  .kicker{font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#cdb98d;font-weight:700}
  h1{font-family:var(--serif);font-size:58px;line-height:1.06;margin:14px 0 18px}
  p{font-size:19px;line-height:1.6;color:#d6e2dd}
  .tabs{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
  .tabs span{border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 16px;font-size:14px}
  .tabs span.on{background:#fff;color:var(--em);border-color:#fff;font-weight:700}
  .phonewrap{flex:1;display:flex;justify-content:center}
  .phone{width:330px;height:690px;background:#0d0f0e;border-radius:44px;padding:12px;
    box-shadow:0 50px 90px -30px rgba(0,0,0,.6)}
  .screen{width:100%;height:100%;background:var(--stage);border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
  .top{height:46px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;
    font-family:var(--serif);font-size:15px;color:var(--ink)}
  .top .r{margin-left:auto;display:flex;gap:8px}
  .top .r i{width:20px;height:20px;border-radius:5px;background:#eee}
  .work{flex:1;position:relative;display:flex;align-items:center;justify-content:center;padding:16px}
  .mini{width:172px;aspect-ratio:210/297;background:#fff;box-shadow:0 12px 26px rgba(0,0,0,.25);
    padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px;align-content:start}
  .mp{background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.15);padding:3px 3px 0}
  .mp .ph{aspect-ratio:1;background:linear-gradient(160deg,#f6cf9f,#e88f6b 55%,#7a5b74)}
  .mp:nth-child(2n) .ph{background:linear-gradient(160deg,#c3e2e7,#7fb3bf 55%,#3f6f7a)}
  .mp .b{height:8px}
  .fab{position:absolute;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;background:var(--em);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 8px 18px rgba(0,0,0,.35)}
  .nav{height:58px;background:#fff;border-top:1px solid var(--line);display:flex}
  .nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    font-size:10.5px;font-weight:600;color:#9a958a}
  .nav div.on{color:var(--em)}
  .nav div .d{width:20px;height:20px;border-radius:6px;background:#e6e0d4}
  .nav div.on .d{background:var(--em)}
  .url{position:absolute;left:100px;bottom:44px;color:#a9c3ba;font-size:14px}
</style></head><body>

  <div class="txt">
    <div class="kicker">Interface de celular</div>
    <h1>Dá pra montar tudo pelo celular.</h1>
    <p>Quatro abas na base, pinça pra dar zoom, e o PDF sai do mesmo jeito.</p>
    <div class="tabs"><span class="on">Fotos</span><span>Folha</span><span>Estilo</span><span>Exportar</span></div>
  </div>

  <div class="phonewrap">
    <div class="phone"><div class="screen">
      <div class="top">Polaroide Studio <span class="r"><i></i><i></i><i></i></span></div>
      <div class="work">
        <div class="mini">
          <div class="mp"><div class="ph"></div><div class="b"></div></div>
          <div class="mp"><div class="ph"></div><div class="b"></div></div>
          <div class="mp"><div class="ph"></div><div class="b"></div></div>
          <div class="mp"><div class="ph"></div><div class="b"></div></div>
          <div class="mp"><div class="ph"></div><div class="b"></div></div>
          <div class="mp"><div class="ph"></div><div class="b"></div></div>
        </div>
        <div class="fab">+</div>
      </div>
      <div class="nav">
        <div class="on"><span class="d"></span>Fotos</div>
        <div><span class="d"></span>Folha</div>
        <div><span class="d"></span>Estilo</div>
        <div><span class="d"></span>Exportar</div>
      </div>
    </div></div>
  </div>
  <div class="url">polaroidestudio.esmeraldapaper.com.br</div>

</body></html>
