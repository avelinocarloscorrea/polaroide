<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- EXPORTAR: 1600 × 1000 · "Capture full size screenshot" -->
<title>Polaroide Studio — hero</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--em:#3d5c52;--em2:#2f4840;--gold:#a97f3d;--paper:#f2eee6;--stage:#e6e0d4;
    --ink:#23272c;--muted:#6d6a62;--line:#e5dfd3;--serif:'Playfair Display',Georgia,serif;
    --ui:'Inter','Open Sans',system-ui,sans-serif;--hand:'Caveat','Segoe Script',cursive}
  *{box-sizing:border-box;margin:0}
  body{width:1600px;height:1000px;background:
      radial-gradient(1200px 700px at 30% -10%,#fff7ec,transparent 60%),var(--paper);
    font-family:var(--ui);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .frame{width:1360px;height:850px;background:#fff;border-radius:16px;
    box-shadow:0 40px 90px -30px rgba(35,50,45,.45),0 8px 24px rgba(0,0,0,.08);overflow:hidden;
    transform:rotate(-1.1deg)}
  .bar{height:46px;background:#fbf9f4;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 16px}
  .bar i{width:11px;height:11px;border-radius:50%;background:#e0d9cb;display:block}
  .bar .u{margin-left:14px;flex:1;height:24px;background:#fff;border:1px solid var(--line);border-radius:7px;
    display:flex;align-items:center;padding:0 12px;font-size:12px;color:var(--muted)}
  .body{display:flex;height:calc(850px - 46px)}
  .panel{width:210px;background:#f6f3ec;border-right:1px solid var(--line);padding:18px 16px}
  .panel b{font-family:var(--serif);font-size:14px;color:var(--ink);display:block;margin-bottom:14px}
  .panel .row{height:30px;background:#fff;border:1px solid var(--line);border-radius:7px;margin-bottom:9px}
  .panel .chip{display:inline-block;height:26px;border-radius:99px;background:#fff;border:1px solid var(--line);
    padding:0 12px;line-height:26px;font-size:11px;color:var(--muted);margin:0 6px 6px 0}
  .stage{flex:1;background:
      radial-gradient(circle at 50% 0,rgba(255,255,255,.5),transparent 55%),var(--stage);
    display:flex;align-items:center;justify-content:center;padding:36px}
  .sheet{width:520px;aspect-ratio:210/297;background:#fff;box-shadow:0 24px 48px rgba(35,39,44,.22);
    padding:26px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start;border-radius:2px}
  .pol{background:#fff;padding:7px 7px 0;box-shadow:0 3px 8px rgba(0,0,0,.16);border-radius:1px;position:relative}
  .pol .ph{aspect-ratio:1;border-radius:1px}
  .pol .cap{height:26px;display:flex;align-items:center;justify-content:center;font-family:var(--hand);
    font-size:16px;color:#3a3a3a}
  .pol .tape{position:absolute;width:44px;height:15px;background:rgba(214,196,140,.62);
    box-shadow:0 1px 2px rgba(0,0,0,.15);top:-6px}
  .pol .tape.l{left:-4px;transform:rotate(-38deg)} .pol .tape.r{right:-4px;transform:rotate(38deg)}
  .t1{transform:rotate(-2deg)} .t2{transform:rotate(1.6deg)} .t3{transform:rotate(-1deg)}
  .p-sun{background:linear-gradient(180deg,#f8cf9f,#e88f6b 55%,#7a5b74)}
  .p-sea{background:linear-gradient(180deg,#c3e2e7,#7fb3bf 60%,#3f6f7a)}
  .p-sage{background:linear-gradient(180deg,#e2e8cd,#a9bd8a 55%,#6f8f6a)}
  .p-pink{background:linear-gradient(160deg,#f4dbe3,#d99fb0 60%,#8b6b86)}
  .p-gold{background:linear-gradient(180deg,#ffe7ba,#f0b57a 50%,#b9743f)}
  .p-night{background:linear-gradient(180deg,#2f3f5c,#5b6b8c 70%,#c9b7a0)}
  /* selo */
  .badge{position:absolute;right:70px;bottom:70px;background:var(--em);color:#fff;border-radius:14px;
    padding:16px 22px;box-shadow:0 18px 40px -12px rgba(47,72,64,.6);transform:rotate(2deg)}
  .badge b{font-family:var(--serif);font-size:22px;display:block;line-height:1.15}
  .badge span{font-size:12.5px;color:#cfe0d9;letter-spacing:.02em}
  .wm{position:absolute;left:64px;bottom:56px;display:flex;align-items:center;gap:12px}
  .wm svg{width:38px;height:38px}
  .wm .n{font-family:var(--serif);font-size:20px;color:var(--ink);line-height:1}
  .wm .s{font-size:12px;color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-weight:700}
</style></head><body>

  <div class="frame">
    <div class="bar"><i></i><i></i><i></i>
      <div class="u">polaroidestudio.esmeraldapaper.com.br</div></div>
    <div class="body">
      <div class="panel">
        <b>Modelos de folha</b>
        <span class="chip">A4 · 3×3</span><span class="chip">A4 · 4×5</span><span class="chip">A3</span>
        <div style="height:14px"></div>
        <b>Formato do polaroide</b>
        <div class="row"></div><div class="row"></div><div class="row" style="width:70%"></div>
        <div style="height:14px"></div>
        <b>Folha e grade</b>
        <div class="row"></div><div class="row" style="width:60%"></div>
      </div>
      <div class="stage">
        <div class="sheet">
          <div class="pol t1"><div class="ph p-sun"></div><div class="cap">verão</div><i class="tape l"></i></div>
          <div class="pol t2"><div class="ph p-sea"></div><div class="cap">praia</div></div>
          <div class="pol t3"><div class="ph p-sage"></div><div class="cap">sítio</div><i class="tape r"></i></div>
          <div class="pol t2"><div class="ph p-pink"></div><div class="cap">fim de tarde</div></div>
          <div class="pol t3"><div class="ph p-gold"></div><div class="cap">estrada</div></div>
          <div class="pol t1"><div class="ph p-night"></div><div class="cap">noite</div></div>
          <div class="pol t3"><div class="ph p-sea"></div><div class="cap">rio</div><i class="tape l"></i></div>
          <div class="pol t1"><div class="ph p-sun"></div><div class="cap">janela</div></div>
          <div class="pol t2"><div class="ph p-sage"></div><div class="cap">trilha</div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="wm">
    <svg viewBox="0 0 64 64"><rect x="9" y="7" width="46" height="50" rx="5" fill="#fff" stroke="#3d5c52" stroke-width="3.5"/><rect x="15" y="13" width="34" height="27" rx="2" fill="#3d5c52"/><circle cx="32" cy="26.5" r="7.5" fill="#fff"/><circle cx="32" cy="26.5" r="3.4" fill="#3d5c52"/></svg>
    <div><div class="n">Polaroide Studio</div><div class="s">Esmeralda Paper</div></div>
  </div>
  <div class="badge"><b>Pronto pra<br>imprimir</b><span>PDF · marcas de corte</span></div>

</body></html>
