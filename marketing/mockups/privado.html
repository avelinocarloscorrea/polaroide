<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<!-- EXPORTAR: 1400 × 1000 -->
<title>Polaroide Studio — privado</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--em:#3d5c52;--em2:#2f4840;--gold:#a97f3d;--serif:'Playfair Display',Georgia,serif;
    --ui:'Inter','Open Sans',system-ui,sans-serif}
  *{box-sizing:border-box;margin:0}
  body{width:1400px;height:1000px;background:
      radial-gradient(800px 800px at 50% -20%,#4a736680,transparent 60%),var(--em2);
    font-family:var(--ui);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 140px;overflow:hidden}
  .shield{width:132px;height:132px;margin-bottom:34px}
  .shield svg{width:100%;height:100%}
  .kicker{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:#cdb98d;font-weight:700}
  h1{font-family:var(--serif);font-size:64px;line-height:1.08;margin:14px 0 30px;max-width:960px}
  .rows{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;max-width:1020px}
  .rows div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;
    padding:16px 22px;font-size:16px;color:#e3ede9}
  .rows b{color:#fff}
  .foot{position:absolute;bottom:52px;display:flex;align-items:center;gap:12px}
  .foot .n{font-family:var(--serif);font-size:19px}
  .foot .s{color:#a9c3ba;font-size:14px}
</style></head><body>

  <span class="shield"><svg viewBox="0 0 24 24" fill="none" stroke="#cdb98d" stroke-width="1.4"
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg></span>

  <div class="kicker">Privado por padrão</div>
  <h1>Suas fotos não vão pra lugar nenhum.</h1>

  <div class="rows">
    <div>Tudo acontece <b>no seu navegador</b>.</div>
    <div>Cada imagem é redesenhada — sai <b>sem EXIF nem localização</b>.</div>
    <div>Funciona <b>offline</b>. Sem conta, sem anúncio.</div>
  </div>

  <div class="foot">
    <div class="n">Polaroide Studio</div>
    <div class="s">· polaroidestudio.esmeraldapaper.com.br</div>
  </div>

</body></html>
